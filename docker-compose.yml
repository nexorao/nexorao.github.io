# Production-oriented local database (no Docker on the dev machine is required:
# `npm run db:start` boots an embedded PostgreSQL 18 into ./.pgdata instead).
# This compose file exists for CI/staging parity and any machine with Docker.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nexora
    ports:
      - "5433:5432"
    volumes:
      - nexora-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexora-pgdata:
