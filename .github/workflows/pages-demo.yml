# Static demo of the NEXORAO marketing site for GitHub Pages.
# The full server app (chat, auth, dashboard, payments) needs a Node server
# and a database; this branch builds only the public marketing pages with
# NEXORAO_STATIC_EXPORT=1 (see next.config.ts).
name: Deploy NEXORAO demo to GitHub Pages

on:
  push:
    branches: ["github-pages-demo"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. Do NOT cancel in-progress runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npx next build
        env:
          NEXORAO_STATIC_EXPORT: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # With output: "export", a custom distDir IS the export destination
          # (build artifacts stay in .next). Our distDir is ".next-export".
          path: .next-export

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
